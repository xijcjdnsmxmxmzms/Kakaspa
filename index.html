<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c2a30;--mute:#7b8d93;--teal:#1f6b7a;--bg:#f5f7f8;--line:#e6ecee;--red:#e8503a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 Manrope,system-ui,sans-serif;overscroll-behavior:none}
#app{max-width:560px;margin:0 auto;padding:14px 14px 40px}
#app.has-nav{padding-bottom:96px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:18px;margin:22px 4px 8px}h3{font-size:16px;margin:0 0 2px}
p{margin:6px 0 0}
.mute{color:var(--mute);font-weight:500}
.top{display:flex;justify-content:space-between;align-items:baseline}
.card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 1px 10px #0a2a3510;margin-top:12px}
.btn{border:0;border-radius:14px;padding:13px 16px;font:700 15px Manrope,sans-serif;background:var(--teal);color:#fff;width:100%;cursor:pointer}
.btn.sec{background:#e8f0f2;color:var(--teal)}.btn.sq{width:52px;flex:none;padding:13px 0;font-size:20px;line-height:1}
.row{display:flex;gap:8px;margin-top:10px}
.lnk{border:0;background:none;color:var(--teal);font:700 13px Manrope;padding:6px 0 0;cursor:pointer}
.lnk[hidden]{display:none}
/* история */
.hist{display:flex;gap:12px;align-items:center;cursor:pointer;padding:12px}
.hist img{width:56px;height:56px;border-radius:14px;object-fit:cover;flex:none;background:#dfe7ea}
.hist>div{flex:1;min-width:0}.hist b{font-size:17px}.hist small{display:block;color:var(--mute);font-size:12px}
.hist .x{border:0;background:none;color:#b3c0c5;font-size:22px;padding:6px 10px;cursor:pointer}
.chip{display:inline-block;background:#e8f0f2;color:var(--teal);font-size:11px;font-weight:700;padding:2px 8px;border-radius:9px;margin-left:6px;vertical-align:2px}
.chip.draft{background:#fdeee9;color:#c4503a}
.set label{display:flex;gap:10px;align-items:flex-start;font-size:13px;margin-top:10px}
.set input{width:20px;height:20px;accent-color:var(--teal);flex:none;margin:0}
.set input[type=color]{padding:0;border:0;background:none}
.set input[type=range]{width:100%;height:auto;margin:8px 0 0;flex:none}
.set label>span{flex:1;min-width:0}
/* разметка */
.bar{height:5px;background:var(--line);border-radius:3px;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--teal);border-radius:3px;transition:width .2s}
.pt{display:flex;gap:12px;align-items:flex-start}
.dgw{flex:0 0 38%;max-width:170px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;line-height:0;cursor:zoom-in}
.dgw img{width:100%;max-height:24vh;object-fit:contain;display:block}
.pt,.gi{flex-direction:column;gap:10px}
.dgw{flex:none !important;width:100%;max-width:none}
.dgw img,.gi .dgw img{width:100%;max-height:none}
.gl figure{flex:0 0 85% !important;font-size:12px}
.pt .ds{font-size:13px;margin-top:6px;color:#34464d}
.fxs{margin-top:10px;padding:12px 16px}
#fx{position:relative;touch-action:none;border-radius:18px;overflow:hidden;margin-top:10px;background:#000;line-height:0;user-select:none;-webkit-user-select:none}
#fx>svg{width:100%;display:block}
.lpw{position:absolute;top:8px;width:104px;height:104px;border-radius:50%;border:3px solid #fff;overflow:hidden;display:none;box-shadow:0 2px 10px #0006;background:#000;pointer-events:none}
.lpw svg{width:100%;height:100%;display:block}
.lpw:before,.lpw:after{content:"";position:absolute;background:var(--red);z-index:1}
.lpw:before{left:50%;top:calc(50% - 9px);width:1px;height:18px}.lpw:after{top:50%;left:calc(50% - 9px);height:1px;width:18px}
.lat{font-size:12px;font-style:italic}
#ph{position:relative;touch-action:none;border-radius:18px;overflow:hidden;margin-top:12px;line-height:0;user-select:none;-webkit-user-select:none}

.dot{position:absolute;width:5px;height:5px;margin:-2.5px;border-radius:50%;background:#fffc;border:1px solid var(--teal);display:none;pointer-events:none}
.dot.cur{width:9px;height:9px;margin:-4.5px;background:var(--red);border:1.5px solid #fff}

#lp:before,#lp:after{content:"";position:absolute;background:var(--red)}
#lp:before{left:50%;top:calc(50% - 9px);width:1px;height:18px}#lp:after{top:50%;left:calc(50% - 9px);height:1px;width:18px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;max-width:560px;margin:0 auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
.btn:disabled{opacity:.4;cursor:default}
select{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:#fff;padding:0 8px;font:600 13px Manrope;color:var(--ink)}
/* вкладки-пилюли */
.tabs{position:sticky;top:0;z-index:4;display:flex;gap:8px;overflow-x:auto;margin:10px -14px 0;padding:8px 14px;background:var(--bg);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;border-radius:22px;padding:10px 18px;font:700 14px Manrope,sans-serif;background:#fff;color:var(--mute);box-shadow:0 1px 6px #0a2a3512;cursor:pointer}
.tabs button.on{background:#1c2a30;color:#fff}
.curve svg{width:100%;display:block}
/* результат */
.hero{position:relative;border-radius:24px;overflow:hidden;line-height:0;background:#222}
.hero img{width:100%;max-height:70vh;object-fit:cover}
.hero .hpair{position:static;display:flex;gap:2px;padding:0;background:none;line-height:0}.hero .hpair img{width:50%;height:min(52vh,360px);max-height:none}
.hero div{position:absolute;inset:auto 0 0 0;padding:46px 18px 16px;line-height:1.2;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;background:linear-gradient(transparent,#17606ad9)}

.pill{background:#fff;border-radius:20px;padding:14px 16px;margin-top:10px;box-shadow:0 1px 8px #0a2a350d}
.ph{display:flex;align-items:center;gap:8px;cursor:pointer}.ph>span{flex:1;font-size:15px}
.full{display:block;font-size:11px;font-weight:500;color:var(--mute);margin-top:2px;line-height:1.25}
.badge{background:#e8f0f2;color:#6b8890;font-size:11px;padding:2px 8px;border-radius:9px;margin-left:6px;white-space:nowrap}
.sc{color:var(--teal);font-size:21px;font-weight:600}.ph em{color:#aab8bd;font-style:normal;transition:.2s}.open em{transform:rotate(90deg)}
.zone{position:relative;height:12px;margin-top:12px;border-radius:7px;background:linear-gradient(90deg,#f1d9c6,#d6dcc0 22%,#b7d6dc 35%,#b7d6dc 65%,#d6dcc0 78%,#f1d9c6)}
.zone i{position:absolute;top:1px;width:24px;height:10px;margin-left:-12px;background:#fff;border-radius:6px;box-shadow:0 0 0 1px #0002}
.det{display:none;margin-top:12px;font-size:13px}.open .det{display:block}.det svg{max-height:78vh;width:100%;border-radius:14px;background:#000;display:block;margin-bottom:8px}
.gl{display:flex;gap:8px;overflow-x:auto;margin:6px 0 10px;padding-bottom:4px}.gl figure{margin:0;flex:0 0 120px;font-size:11px;line-height:1.2;color:var(--mute)}
.gl img,.gi img{width:100%;background:#fff;border-radius:12px;display:block;margin-bottom:3px}
.gi{display:flex;gap:12px;align-items:flex-start}.gi img{width:130px;flex:none;margin:0;cursor:zoom-in}
.st ul{margin:6px 0 0;padding-left:18px}.st li{margin:3px 0}
/* оценка по эталонам и контуры */
.rrow{display:flex;align-items:center;gap:8px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.rrow>span{flex:1}.rrow b{color:var(--teal);font-size:16px}.rrow em{color:#aab8bd;font-style:normal}
.refpair{display:flex;gap:8px;margin-top:12px;align-items:flex-start}
.refpair figure{margin:0;flex:1;min-width:0}
.refpair figcaption{font-size:12px;color:var(--mute);margin-top:4px;line-height:1.25;word-break:break-all}
/* contain — кадр показывается целиком, ничего не обрезается */
.cv{width:100%;aspect-ratio:1;object-fit:contain;border-radius:16px;background:#2a3438;display:block;cursor:zoom-in}
.strip{display:flex;gap:6px;overflow-x:auto;margin:10px 0 4px;padding-bottom:4px;position:relative}
.strip figure{margin:0;flex:0 0 62px;text-align:center;font-size:11px;color:var(--mute);border:2px solid transparent;border-radius:12px;padding:2px;cursor:pointer}
.strip figure.on{border-color:var(--teal);color:var(--teal)}
.strip img{width:100%;border-radius:8px;display:block;background:#dfe7ea;min-height:20px}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:20px;flex:none}
.gh{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 2px}
.curve h3{margin-bottom:4px}
.mc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:8px 0 10px;box-shadow:0 1px 8px #0a2a3510}
.mch{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;letter-spacing:.03em;color:#6b777c}
.mch span{font-weight:500;font-size:12px;letter-spacing:0;color:var(--mute)}
.mch i{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-2px;margin-right:4px;box-sizing:border-box}
.mch .d1{background:#cfe3d6;border:2px solid #8fbf9f}.mch .d2{background:#fff;border:3px solid #6a7479;margin-left:4px}
.mc svg{width:100%;display:block}
.det .mc svg{background:none;border-radius:0;margin:6px 0 0}
.seg{display:flex;gap:8px;margin-top:12px}
.seg button{flex:1;border:0;border-radius:16px;padding:12px 14px;background:#fff;color:var(--mute);font:700 14px Manrope,sans-serif;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 6px #0a2a3512;cursor:pointer}
.seg button.on{background:#1c2a30;color:#fff}
.pthumb{display:flex;gap:12px;align-items:center}.pthumb img{width:72px;height:72px;border-radius:14px;object-fit:cover}
/* прочее */
.ov{position:fixed;inset:0;background:#000d;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.ov img{max-width:100%;max-height:100%;background:#fff;border-radius:16px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c2a30;color:#fff;padding:10px 16px;border-radius:14px;font-size:13px;z-index:30;max-width:90%;text-align:center}
</style></head><body><div id="app"></div>
<script>
'use strict';
function showFatal(msg) {
  const a = document.getElementById('app'); if (!a) return;
  if (a.innerHTML.trim()) { try { toast('Ошибка: ' + String(msg).slice(0, 120)); } catch {} return; }
  a.innerHTML = '<h1>Что-то пошло не так</h1><div class="card"><p style="margin:0;font-size:13px;word-break:break-word">' + String(msg).replace(/</g, '&lt;') + '</p>' +
    '<div class="row"><button class="btn" onclick="location.reload()">Перезапустить</button></div>' +
    '<div class="row"><button class="btn sec" onclick="try{indexedDB.deleteDatabase(\'patrick-analysis\');localStorage.clear();}catch(e){}setTimeout(function(){location.reload()},400)">Очистить историю и перезапустить</button></div></div>';
}
window.addEventListener('error', e => showFatal((e.message || 'ошибка') + (e.lineno ? ' (строка ' + e.lineno + ')' : '')));
window.addEventListener('unhandledrejection', e => showFatal(e.reason?.stack || e.reason || 'ошибка'));
/* =====================================================================
   1. УТИЛИТЫ И TELEGRAM
   ===================================================================== */
const IMG_DIR = 'img';                       // папка с диаграммами рядом с index.html (регистр важен!)
const tg = window.Telegram?.WebApp;
try { tg?.ready(); tg?.expand(); tg?.disableVerticalSwipes?.(); } catch {}

const $ = s => document.querySelector(s);
const cap = s => s[0].toUpperCase() + s.slice(1);
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const haptic = (t = 'light') => { try { tg?.HapticFeedback?.impactOccurred(t); } catch {} };
const fmtDate = ts => new Date(ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });

function toast(msg) {
  document.querySelector('.toast')?.remove();
  const t = Object.assign(document.createElement('div'), { className: 'toast', textContent: msg });
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
const ask = msg => new Promise(res => {
  try { if (tg?.showConfirm && tg.isVersionAtLeast?.('6.2')) return tg.showConfirm(msg, res); } catch {}
  res(confirm(msg));
});
function readJSON(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } }
function writeJSON(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

/* Настройки (лёгкие, поэтому localStorage). line — цвет линий и углов на схемах; video — «режим видео»: скрывает название бота */
const Settings = { level: true, auto: false, line: '#9aa5aa', width: 1, dot: 1, sort: 'cat', video: false, ...readJSON('pa_settings', {}) };
const saveSettings = () => writeJSON('pa_settings', Settings);
const BRAND = () => Settings.video ? '' : 'Patrick analysis';
const applyBrand = () => { document.title = Settings.video ? ' ' : 'Patrick analysis'; };
applyBrand();

/* =====================================================================
   2. ХРАНИЛИЩЕ ИСТОРИИ (IndexedDB, фото слишком тяжёлые для localStorage)
   ===================================================================== */
const Store = (() => {
  const mem = new Map();               // запасной вариант, если IndexedDB недоступна
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((ok, fail) => {
    try {
      const r = indexedDB.open('patrick-analysis', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('faces', { keyPath: 'id' });
      r.onsuccess = () => ok(r.result);
      r.onerror = () => fail(r.error);
    } catch (e) { fail(e); }
  }).catch(() => null));
  const run = async (mode, fn) => {
    const db = await open(); if (!db) return null;
    return new Promise((ok, fail) => {
      const t = db.transaction('faces', mode), req = fn(t.objectStore('faces'));
      t.oncomplete = () => ok(req?.result); t.onerror = () => fail(t.error);
    });
  };
  return {
    async all() {
      const r = await run('readonly', s => s.getAll()).catch(() => null);
      return (r || [...mem.values()]).filter(x => x && x.id).map(x => { x.pts = x.pts || {}; x.thumb = x.thumb || x.img || ''; return x; }).sort((a, b) => (b.updated || 0) - (a.updated || 0));
    },
    async get(id) { return (await run('readonly', s => s.get(id)).catch(() => null)) || mem.get(id) || null; },
    async put(rec) { mem.set(rec.id, rec); await run('readwrite', s => s.put(rec)).catch(() => {}); },
    async del(id) { mem.delete(id); await run('readwrite', s => s.delete(id)).catch(() => {}); }
  };
})();

/* =====================================================================
   3. 48 ТОЧЕК: ключ = имя файла диаграммы в img/<ключ>.webp
   «Левая/правая» — как на диаграмме точки.
   ===================================================================== */
const SIDE = { left: { m: 'Левый', f: 'Левая' }, right: { m: 'Правый', f: 'Правая' } };
const PTS = [];
const one = (k, ru, lat, ds) => PTS.push({ k, ru, lat, ds });
/* шаблон ключа: «$Имя» → leftИмя/rightИмя, «имя$» → имяLeft/имяRight */
const pair = (tpl, gender, ru, lat, ds) => ['left', 'right'].forEach(s => PTS.push({
  k: tpl.startsWith('$') ? s + tpl.slice(1) : tpl.slice(0, -1) + cap(s),
  ru: ru.replace('{}', SIDE[s][gender]), lat, ds
}));

one('hairline', 'Линия роста волос', 'Trichion',
  'Строго по центру лба: самая верхняя точка, где начинают расти волосы. Если волосы зачёсаны или есть залысины — ставьте там, где реально начинается рост.');
pair('$EyePupil', 'm', '{} зрачок', 'Pupilla',
  'Центр зрачка — тёмная точка в середине радужки. Если мешает блик, ориентируйтесь на центр радужки.');
pair('nose$', 'm', '{} край носа', 'Ala Nasi',
  'Самая внешняя точка крыла носа на этой стороне — там, где ноздря шире всего.');
one('lowerLip', 'Центр нижней губы', 'Labrale Inferius',
  'Центр нижней губы по вертикальной оси лица, в самой полной и выступающей части красной каймы.');
one('chinBottom', 'Низ подбородка', 'Menton',
  'Самая нижняя точка подбородка строго по центру, между левой и правой точками подбородка.');
pair('$Temple', 'm', '{} висок', 'Temporal Point',
  'Самая широкая точка лба на этой стороне: на боковой границе роста волос, примерно на полпути между линией роста и бровью.');
pair('$EyeMedialCanthus', 'm', '{} глаз: внутренний угол', 'Canthus Medialis',
  'Внутренний угол глаза: место у переносицы, где сходятся верхнее и нижнее веко.');
pair('$EyeLateralCanthus', 'm', '{} глаз: внешний угол', 'Canthus Lateralis',
  'Внешний угол глаза: место у виска, где верхнее и нижнее веко смыкаются.');
pair('$EyeUpperEyelid', 'm', '{} глаз: верхнее веко', 'Palpebra Superior',
  'Самая высокая точка края верхнего века над радужкой (на линии ресниц, глаз открыт).');
pair('$EyeLowerEyelid', 'm', '{} глаз: нижнее веко', 'Palpebra Inferior',
  'Самая низкая точка края нижнего века под радужкой.');
pair('$BrowHead', 'f', '{} бровь: начало', 'Supercilium Medialis',
  'Начало брови: самая внутренняя (ближняя к переносице) и верхняя точка, где заканчиваются волоски.');
pair('$BrowInnerCorner', 'f', '{} бровь: внутренний угол', 'Supercilium Medial Corner',
  'Самая нижняя точка внутреннего края брови, где заканчиваются волоски.');
pair('$BrowArch', 'f', '{} бровь: изгиб', 'Supercilium Superior',
  'Самая высокая точка по нижнему краю брови — место, где бровь достигает пика изгиба.');
pair('$BrowPeak', 'm', '{} пик брови', 'Supercilium Apex',
  'Самая приподнятая точка верхнего края брови. Может оказаться чуть в стороне от точки изгиба.');
pair('$BrowTail', 'f', '{} бровь: хвост', 'Supercilium Lateralis',
  'Самая внешняя точка брови у виска, где волоски сходят на нет.');
pair('$UpperEyelidCrease', 'f', '{} складка верхнего века', 'Pretarsal Skin Crease',
  'Горизонтальная складка верхнего века при открытом глазе, выше линии ресниц. Если складки не видно — ставьте на уровне точки верхнего века.');
one('nasalBase', 'Основание носа', 'Nasal Base',
  'Точка, где заканчивается нижняя часть ноздри; обычно сбоку от кончика носа.');
one('noseBottom', 'Низ носа', 'Subnasale',
  'Самая нижняя точка носа примерно по центру — там, где носовая перегородка переходит в верхнюю губу.');
pair('$NoseBridge', 'f', '{} сторона переносицы', 'Dorsum Nasi',
  'Боковой край спинки носа, где костная часть переходит в кожу лица, примерно на середине высоты носа.');
pair('mouth$', 'm', '{} уголок рта', 'Cheilion',
  'Крайняя точка рта сбоку, где заканчивается линия смыкания губ.');
one('cupidsBow', 'Лук Купидона (пик)', 'Labrale Superius',
  'Самая высокая точка верхней губы — вершина одного из двух пиков лука Купидона, справа или слева от центра.');
one('innerCupidsBow', 'Центр лука Купидона', 'Cupid\'s Bow',

/* =====================================================================
   4. ГЕОМЕТРИЯ
   ===================================================================== */
let CTX = { pts: {}, rot: 0 };
const VIRT = {                               // вычисляемые точки
  G:  ['leftBrowHead', 'rightBrowHead', 'leftBrowInnerCorner', 'rightBrowInnerCorner'],   // глабелла
  BH: ['leftBrowHead', 'rightBrowHead'],                                                  // середина начал бровей
  PM: ['leftEyePupil', 'rightEyePupil'],                                                  // середина зрачков
  ZM: ['leftCheek', 'rightCheek'],                                                        // середина скул
  BM: ['leftBrowInnerCorner', 'rightBrowInnerCorner']                                     // середина внутренних углов бровей
};
const mean = a => ({ x: a.reduce((t, q) => t + q.x, 0) / a.length, y: a.reduce((t, q) => t + q.y, 0) / a.length });
function raw(k) {                            // координаты на фото
  if (CTX.pts[k]) return CTX.pts[k];
  if (VIRT[k]) return mean(VIRT[k].map(raw));
  throw new Error('нет точки ' + k);
}
const rotPt = (p, r) => ({ x: p.x * Math.cos(r) - p.y * Math.sin(r), y: p.x * Math.sin(r) + p.y * Math.cos(r) });
function faceRot(pts) {                      // угол поворота, при котором линия зрачков горизонтальна
  if (!pts.leftEyePupil || !pts.rightEyePupil) return 0;
  const [a, b] = [pts.leftEyePupil, pts.rightEyePupil].sort((p, q) => p.x - q.x);
  return -Math.atan2(b.y - a.y, b.x - a.x);
}
function useFace(pts, level) { CTX = { pts, rot: level ? faceRot(pts) : 0 }; }
const P = k => rotPt(raw(k), CTX.rot);   // координаты для расчётов (с выравниванием)
const MID = new Set(['hairline', 'G', 'BH', 'PM', 'ZM', 'BM', 'nasalBase', 'noseBottom', 'chinBottom', 'innerCupidsBow', 'cupidsBow', 'lowerLip', 'mouthMiddle']);
const sideOf = k => { let m = k.match(/^(left|right)(.+)$/); if (m) return [m[1], m[2]]; m = k.match(/^(.+?)(Left|Right)$/); return m ? [m[2].toLowerCase(), m[1]] : null; };
const isMirror = (a, b) => { const x = sideOf(a), y = sideOf(b); return !!x && !!y && x[0] !== y[0] && x[1] === y[1]; };
const isMid = k => MID.has(k);
const d = (a, b) => {
  const A = P(a), B = P(b);
  if (isMirror(a, b)) return Math.abs(A.x - B.x);
  if (isMid(a) && isMid(b)) return Math.abs(A.y - B.y);
  return Math.hypot(A.x - B.x, A.y - B.y);
};
const dy = (a, b) => Math.abs(P(a).y - P(b).y);
const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
const deg = r => r * 180 / Math.PI;
const angV = (u, w) => deg(Math.acos(clamp((u.x * w.x + u.y * w.y) / Math.hypot(u.x, u.y) / Math.hypot(w.x, w.y), -1, 1)));
const ang = (v, a, b) => angV(sub(P(a), P(v)), sub(P(b), P(v)));     // угол в вершине v между лучами к a и b
const avg = f => (f('left') + f('right')) / 2;                        // среднее по двум сторонам

const zy  = () => d('leftCheek', 'rightCheek');
const nw  = () => d('noseLeft', 'noseRight');
const mw  = () => d('mouthLeft', 'mouthRight');
const icd = () => d('leftEyeMedialCanthus', 'rightEyeMedialCanthus');
const ipd = () => d('leftEyePupil', 'rightEyePupil');
const ew  = s => d(s + 'EyeMedialCanthus', s + 'EyeLateralCanthus');
const tgw = () => d('leftTopGonion', 'rightTopGonion');
const ctilt = () => avg(s => { const m = P(s + 'EyeMedialCanthus'), l = P(s + 'EyeLateralCanthus'); return deg(Math.atan2(m.y - l.y, Math.abs(l.x - m.x))); });
/* наклон брови: линия «внутренний угол → изгиб (пик)» к горизонтали от внутреннего угла */
const btilt = () => avg(s => {
  const v = P(s + 'BrowInnerCorner'), q = P(s + 'BrowArch');
  return deg(Math.atan2(v.y - q.y, Math.abs(q.x - v.x)));
});
const iaa = () => ang('noseBottom', 'rightEyeLateralCanthus', 'leftEyeLateralCanthus');
const jfa = () => angV(sub(P('chinLeft'), P('leftBottomGonion')), sub(P('chinRight'), P('rightBottomGonion')));
const bit = () => d('leftTemple', 'rightTemple') / zy() * 100;
const big = () => tgw() / zy() * 100;                                  // Bigonial: по верхним углам челюсти
const jaw = () => d('leftEarGonion', 'rightEarGonion') / zy();          // Jaw Width: на уровне низа ушей
const third = i => { const t = [d('hairline', 'G'), d('G', 'noseBottom'), d('noseBottom', 'chinBottom')]; return t[i] / (t[0] + t[1] + t[2]) * 100; };
const ZY = 'leftCheek-rightCheek';

const tri = (R, v, a, b) => ({ v: R(v), a: R(a), b: R(b), dash: [] });
const hz = (R, v, a) => {                   // угол между лучом v→a и горизонталью
  const V = R(v), A = R(a), B = { x: V.x + (A.x >= V.x ? 1 : -1) * Math.abs(A.x - V.x), y: V.y };
  return { v: V, a: A, b: B, dash: [[V, B]] };
};
const sides = f => ['left', 'right'].map(f);
function jfaGeom(R) {                        // линии челюсти продлеваются до точки схождения под подбородком
  const g1 = R('leftBottomGonion'), c1 = R('chinLeft'), g2 = R('rightBottomGonion'), c2 = R('chinRight');
  const d1 = sub(c1, g1), d2 = sub(c2, g2), den = d1.x * d2.y - d1.y * d2.x;
  if (Math.abs(den) < 1e-9) return [];
  const t = ((g2.x - g1.x) * d2.y - (g2.y - g1.y) * d2.x) / den;
  const X = { x: g1.x + d1.x * t, y: g1.y + d1.y * t };
  const l1 = Math.hypot(d1.x, d1.y), l2 = Math.hypot(d2.x, d2.y), L = Math.min(l1, l2) * .6;
  return [{ v: X, a: { x: X.x - d1.x / l1 * L, y: X.y - d1.y / l1 * L }, b: { x: X.x - d2.x / l2 * L, y: X.y - d2.y / l2 * L }, dash: [[c1, X], [c2, X]] }];
}
const iaaGeom = R => [tri(R, 'noseBottom', 'leftEyeLateralCanthus', 'rightEyeLateralCanthus')];
const canthalGeom = R => sides(s => hz(R, s + 'EyeMedialCanthus', s + 'EyeLateralCanthus'));
const browGeom = R => sides(s => hz(R, s + 'BrowInnerCorner', s + 'BrowArch'));

/* =====================================================================
   6. ОЦЕНКА
   ===================================================================== */
const DEV_STEP = 2;                                  // сколько % отклонения снимает 1 балл
const tolOf = m => Math.max((m.max - m.min) / 2, 1e-9);
function scoreMetric(m, v) {
  const mid = (m.min + m.max) / 2, off = Math.abs(v - mid) / tolOf(m);
  const dev = v < m.min ? (m.min - v) / (Math.abs(m.min) || 1) * 100
            : v > m.max ? (v - m.max) / (Math.abs(m.max) || 1) * 100 : 0;
  return { dev, z: dev, score: Math.max(0, 10 - dev / DEV_STEP), off };
}
const fmtDev = x => x.toFixed(1) + '%';

const ptsOf = m => (m.solo && cur?.own?.[m.name]) ? { ...cur.pts, ...cur.own[m.name] } : cur.pts;

function analyze(pts, level, own) {
  const rot = level ? faceRot(pts) : 0;
  const R = M.map(m => {

function analyzeProfile(pts) {
  PC = profCtx(pts);
  const R = PM.map(m => {
    let v = NaN; try { v = m.f(); } catch {}
    const bad = !isFinite(v); if (bad) v = 0;
    let score = 0, tier = 0, txt = null;
    try { score = bad ? 0 : m.sc(v); tier = m.tier(v); txt = m.text ? m.text() : null; } catch {}
    return { ...m, v, bad, score: clamp(score, 0, 10), tier, txt };
  });
  return { R, harmony: R.reduce((t, m) => t + m.score, 0) / R.length };
}
const profDone = r => !!r.pimg && PPTS.every(p => r.ppts?.[p.k]);
const combinedHarmony = () => cur?.harmony == null ? null : cur.pHarmony != null ? (cur.harmony + cur.pHarmony) / 2 : cur.harmony;

function pGeom(m, rot) {
  const R = k => rotPt(cur.ppts[k], rot), ex = m.ex ? m.ex(R) : {}, an = m.an ? m.an(R) : [];
  const sg = (m.ln ? segs(m.ln) : []).map(([a, b]) => [R(a), R(b)]).concat(ex.sg || []);
  const full = [];
  if (!m.clean && cur.ppts.nasion) full.push(vline(R('nasion').x));      // вертикаль на уровне nasion
  if (!m.clean && cur.ppts.tragus) full.push(hline(R('tragus').y));      // горизонталь на уровне tragus (параллельна франкфуртской)
  (ex.full || []).forEach(l => full.push(l));
  return { sg, an, dash: [...an.flatMap(q => q.dash || []), ...(ex.dash || [])], full };
}
/* схема профильной метрики: приближение к зоне замера; всё лицо целиком — только у метрик с пометкой wide (Gonion to Mouth) */
function pMeasureSvg(m) {
  const rot = profRot(cur.ppts), g = pGeom(m, rot), pts = geomPts(g), vb = (m.wide || !pts.length) ? fullVB(cur.ppts, rot) : viewBoxFor(pts);
  return svgBase(vb, rot, '', { img: cur.pimg, w: cur.pw, h: cur.ph }) + geomSvg(g, vb.w, !m.clean) + '</svg>';
}

const loadImage = file => new Promise((ok, fail) => {
  const url = URL.createObjectURL(file), im = new Image();
  im.onload = () => { URL.revokeObjectURL(url); ok(im); };
  im.onerror = () => fail(new Error('Не удалось открыть изображение'));
  im.src = url;
});
function scaled(im, max, q) {
  const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
  c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
  c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  return { url: c.toDataURL('image/jpeg', q), w: c.width, h: c.height };
}
async function createRecord(file) {
  const im = await loadImage(file), big = scaled(im, 1200, .88), th = scaled(im, 160, .7);
  return { id: uid(), created: Date.now(), updated: Date.now(), img: big.url, w: big.w, h: big.h,
           thumb: th.url, pts: {}, own: {}, gender: null, ref: {}, i: 0, harmony: null, total: null, tier: null };
}
let saveTimer = 0;
function persist(now = false) {
  clearTimeout(saveTimer);
  const run = () => { if (cur) { cur.updated = Date.now(); try { const f = finalScore(); cur.total = f.ready ? f.total : null; } catch {} Store.put(cur); } };
  now ? run() : (saveTimer = setTimeout(run, 300));
}
async function migrateOldDraft() {              // перенос черновика из старой версии (localStorage.pa)
  const old = readJSON('pa', null); if (!old?.img) return;
  const im = new Image(); im.src = old.img; await im.decode().catch(() => {});
  const th = scaled(im, 160, .7);
  await Store.put({ id: uid(), created: Date.now(), updated: Date.now(), img: old.img, w: old.w, h: old.h,
                    thumb: th.url, pts: old.pts || {}, own: {}, gender: 'male', ref: {}, i: old.i || 0, harmony: null, tier: null });
  try { localStorage.removeItem('pa'); } catch {}
}

  : { list: PTS, pts: cur.pts, img: cur.img, w: cur.w, h: cur.h, key: 'i', title: 'Разметка' };
const countK = k => k.list.filter(q => k.pts[q.k]).length;

function renderMark() {
  const k = K(), ix = cur[k.key], p = k.list[ix], n = countK(k), last = ix === k.list.length - 1;
  render('mark', `<div class="top"><h1>${k.title}</h1><span class="mute" id="cnt">${n}/${k.list.length}</span></div>
    <div class="bar"><i id="barfill" style="width:${n / k.list.length * 100}%"></i></div>
    <div class="card pt"><div class="dgw" data-a="zoom" data-k="${p.k}">${dgm(p.k)}</div>
      <div><h3>${ix + 1}. ${p.ru}</h3><div class="mute lat">${p.lat}</div><div class="ds">${p.ds}</div>
        <button class="lnk" id="clr" data-a="clear" ${k.pts[p.k] ? '' : 'hidden'}>Сбросить точку</button></div></div>
    <div id="ph"><img src="${k.img}" draggable="false" alt=""><div id="lp" style="background-image:url(${k.img})"></div></div>
    <p class="mute" style="font-size:12px;text-align:center">Коснитесь фото и ведите палец — точка двигается, в лупе видно, куда ставить.${kind === 'side' ? '<br>Жёлтые пунктиры: вертикаль через nasion и горизонталь через tragus (франкфуртская плоскость).' : ''}</p>
    <div class="nav"><button class="btn sec sq" data-a="prev" ${ix ? '' : 'disabled'}>‹</button>
      <select id="sel">${k.list.map((q, i) => `<option value="${i}" ${i === ix ? 'selected' : ''}>${k.pts[q.k] ? '✓ ' : ''}${i + 1}. ${q.ru}</option>`).join('')}</select>
      <button class="btn sq" data-a="next" style="${last ? 'width:auto;padding:0 14px;font-size:15px' : ''}">${last ? 'Готово' : '›'}</button></div>`, true);
  bindPhoto(p);
}

function bindPhoto(p) {
  const k = K(), ph = $('#ph'), lp = $('#lp'), dots = {};
  let ov = null;
  if (kind === 'side') {
    ov = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    ov.setAttribute('viewBox', `0 0 ${k.w} ${k.h}`);
    ov.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none';
    ph.appendChild(ov);
  }
  const drawFH = () => {
    if (!ov) return;
    const rot = profRot(k.pts), L = (k.w + k.h) * 2, sw = k.w / 260, dir = (x, y) => rotPt({ x, y }, -rot);
    const line = (Pt, d) => `<line x1="${Pt.x - d.x * L}" y1="${Pt.y - d.y * L}" x2="${Pt.x + d.x * L}" y2="${Pt.y + d.y * L}" stroke="#ffd45e" stroke-width="${sw}" stroke-dasharray="${sw * 5} ${sw * 3.5}" stroke-opacity=".9"/>`;
    let h = '';
    if (k.pts.nasion) h += line(k.pts.nasion, dir(0, 1));
    if (k.pts.tragus) h += line(k.pts.tragus, dir(1, 0));
    ov.innerHTML = h;
  };
  k.list.forEach(q => { const e = document.createElement('i'); e.className = 'dot'; ph.appendChild(e); dots[q.k] = e; });
  const paint = q => {
    const c = k.pts[q.k], e = dots[q.k];
    e.style.display = c ? 'block' : 'none';
    if (c) { e.style.left = c.x / k.w * 100 + '%'; e.style.top = c.y / k.h * 100 + '%'; }
    e.classList.toggle('cur', q === p);
  };
  k.list.forEach(paint); drawFH();

  const at = e => {
    const r = ph.getBoundingClientRect(), fx = clamp((e.clientX - r.left) / r.width), fy = clamp((e.clientY - r.top) / r.height);
    k.pts[p.k] = { x: fx * k.w, y: fy * k.h };
    paint(p); drawFH();
    const L = 104, Z = 3;                                    // размер и кратность лупы
    lp.style.display = 'block';
    lp.style.left = fx < .45 ? 'auto' : '8px'; lp.style.right = fx < .45 ? '8px' : 'auto';
    lp.style.backgroundSize = r.width * Z + 'px auto';
    lp.style.backgroundPosition = `${L / 2 - 3 - fx * r.width * Z}px ${L / 2 - 3 - fy * r.height * Z}px`;
  };
  let down = false;
  const end = () => {
    if (!down) return; down = false; lp.style.display = 'none';
    persist(); refreshProgress(p);
    if (Settings.auto && cur[k.key] < k.list.length - 1) step(1);
  };
  ph.onpointerdown = e => { down = true; ph.setPointerCapture(e.pointerId); at(e); haptic(); };
  ph.onpointermove = e => down && at(e);
  ph.onpointerup = end; ph.onpointercancel = end;
}
function refreshProgress(p) {                    // обновляем счётчики без перерисовки фото
  const k = K(), n = countK(k), ix = cur[k.key];
  $('#cnt').textContent = `${n}/${k.list.length}`;
  $('#barfill').style.width = n / k.list.length * 100 + '%';
  $('#clr').hidden = !k.pts[p.k];
  const opt = $('#sel').options[ix]; if (opt) opt.textContent = `${k.pts[p.k] ? '✓ ' : ''}${ix + 1}. ${p.ru}`;
}
function step(s) {
  const k = K(), n = cur[k.key] + s;
  if (n < 0) return;
  if (n >= k.list.length) return finish();
  cur[k.key] = n; persist(); renderMark(); scrollTo(0, 0);
}

/* После разметки: сначала анфас → (профиль) → затем оценка по эталонам (диморфизм, Misc, ангулярити) → результат */
function afterMarking() {
  if (!cur.refDone && allKeys().some(k => cur.ref?.[k] == null)) {
    cur.refPhase = true; persist(true);
    return renderRefRate(allKeys().find(k => cur.ref?.[k] == null));
  }
  renderResult(null, kind === 'side' ? 'harm' : 'over');
}
function finish() {
  const k = K(), miss = k.list.findIndex(p => !k.pts[p.k]);
  if (miss >= 0) { cur[k.key] = miss; persist(); renderMark(); scrollTo(0, 0); return toast(`Не поставлена точка: ${k.list[miss].ru}`); }
  if (kind === 'front' && !cur.pimg && !cur.pAsked) return offerProfile();
  if (kind === 'side') hsub = 'side';
  afterMarking();
}
async function offerProfile() {
  const yes = await ask('Разметка анфаса готова. Добавить фото профиля для оценки профильных метрик?');
  cur.pAsked = true; persist(true);
  if (!yes) return afterMarking();
  const inp = Object.assign(document.createElement('input'), { type: 'file', accept: 'image/*' });
  inp.onchange = () => inp.files[0] ? loadProfileFile(inp.files[0]) : afterMarking();
  inp.addEventListener('cancel', () => afterMarking());
  inp.click();
}
async function loadProfileFile(file) {
  try {
    const im = await loadImage(file), b = scaled(im, 1200, .88);
    Object.assign(cur, { pimg: b.url, pw: b.w, ph: b.h, ppts: {}, pi: 0, pHarmony: null });
    kind = 'side'; persist(true); renderMark(); scrollTo(0, 0);
  } catch (err) { toast(err.message || 'Не удалось загрузить фото'); }
}

/* порядок метрик: по настройке «Порядок метрик» (в т.ч. в Ангулярити / Диморфизм / Misc — см. groupKeys) */
const sortFn = R => ({
  best: (a, b) => R[b].score - R[a].score || (R[a].off || 0) - (R[b].off || 0),
  worst: (a, b) => R[a].score - R[b].score || (R[b].off || 0) - (R[a].off || 0),
  alpha: (a, b) => R[a].name.localeCompare(R[b].name)
}[Settings.sort]);
function pillOrder(R, cats) {                    // индексы метрик в том порядке, в каком они показаны в списке
  const order = sortFn(R);
  if (order) return R.map((m, i) => i).sort(order);
  const idx = new Map(R.map((m, i) => [m.name, i])), used = new Set(cats.flatMap(c => c[1]));
  return [...cats, ['Другое', R.filter(m => !used.has(m.name)).map(m => m.name)]].flatMap(([, names]) => names.filter(n => idx.has(n)).map(n => idx.get(n)));
}
function pillsHtml(R, cats, pillFn) {
  if (sortFn(R)) return `<div style="margin-top:12px"></div>` + pillOrder(R, cats).map(i => pillFn(R[i], i)).join('');
  const idx = new Map(R.map((m, i) => [m.name, i])), used = new Set(cats.flatMap(c => c[1]));
  return [...cats, ['Другое', R.filter(m => !used.has(m.name)).map(m => m.name)]].map(([t, names]) => {
    const is = names.filter(n => idx.has(n)).map(n => idx.get(n));
    return is.length ? `<div class="gh"><h2 style="margin:0">${t}</h2></div>${is.map(i => pillFn(R[i], i)).join('')}` : '';
  }).join('');
}
const strengthsHtml = R => {
  const best = [...R].sort((a, b) => b.score - a.score || (a.off || 0) - (b.off || 0)).slice(0, 5);
  const worst = [...R].sort((a, b) => a.score - b.score).filter(m => m.score < 10 - 1e-6).slice(0, 5);
  return `<div class="card st" style="margin-top:18px"><b>Сильные стороны:</b><ul>${best.map(m => `<li>${m.name} — ${m.score.toFixed(1)}/10</li>`).join('')}</ul>
    <p style="margin-top:12px"><b>Слабые стороны:</b></p>
    <ul>${worst.length ? worst.map(m => `<li>${m.name} — ${m.score.toFixed(1)}/10</li>`).join('') : '<li>Нет слабых сторон</li>'}</ul></div>`;
};

/* Ангулярити / Диморфизм / Misc: пилюли-входы; внутри — страница метрики с контуром, эталоном и кривой оценки */

/* области группы в порядке настройки «Порядок метрик» (так же, как в гармонии) */
function groupKeys(g) {
  const keys = allKeys().filter(k => REGIONS[k].g === g), sc = k => cur.ref?.[k] == null ? null : refScore(cur.ref[k]);
  if (Settings.sort === 'alpha') keys.sort((a, b) => REGIONS[a].ru.localeCompare(REGIONS[b].ru));
  else if (Settings.sort === 'best' || Settings.sort === 'worst') {
    const sg = Settings.sort === 'best' ? 1 : -1;
    keys.sort((a, b) => { const x = sc(a), y = sc(b); if (x == null || y == null) return (x == null) - (y == null); return (y - x) * sg; });
  }
  return keys;
}

function refCurveCard(idx) {

  const f0 = Math.ceil(.9 * N), mx = X(idx), my = Y(refScore(idx));

    ${g}<rect x="${X(f0)}" y="${T}" width="${X(N) - X(f0)}" height="${B - T}" fill="#9db4bd" fill-opacity=".28"/>
    <path d="M${X(0)} ${Y(0)}L${X(N)} ${Y(10)}" fill="none" stroke="url(#rgrad)" stroke-width="4" stroke-linecap="round"/>
    <line x1="${mx}" x2="${mx}" y1="${my}" y2="${B}" stroke="#8a9499" stroke-width="3" stroke-dasharray="4 4"/>
    <circle cx="${mx}" cy="${my}" r="8" fill="#fff" stroke="#1f6b7a" stroke-width="4"/>
    <text x="${L}" y="152" font-size="12" fill="#aab8bd">0</text><text x="${(L + Rr) / 2}" y="152" font-size="12" fill="#aab8bd" text-anchor="middle">${Math.round(N / 2)}</text><text x="${Rr}" y="152" font-size="12" fill="#aab8bd" text-anchor="end">${N}</text></svg>`;
  return `<div class="mc"><div class="mch"><b>КРИВАЯ ОЦЕНКИ</b><span><i class="d1"></i>Идеал · <i class="d2"></i>Вы</span></div>${svg}</div>`;
}
function renderGroupDetail(k) {

/* линии замера: «a-b,c-d», «$» → левая и правая сторона */
const segs = ln => ln.split(',')
  .flatMap(s => s.includes('$') ? ['left', 'right'].map(x => s.replaceAll('$', x)) : [s])
  .map(s => s.split('-'));

const faceFrame = () => Settings.level ? faceRot(cur.pts) : 0;
function frameGeom(m, rot) {
  CTX = { pts: ptsOf(m), rot: 0 };
  const R = k => rotPt(raw(k), rot);
  const gg = m.gm ? m.gm(R) : null;
  const sg = gg ? gg.sg : segs(m.ln).map(([a, b]) => {
    const A = R(a), B = R(b);
    if (isMirror(a, b)) { const y = (A.y + B.y) / 2; return [{ x: A.x, y }, { x: B.x, y }]; }
    if (isMid(a) && isMid(b)) { const x = (A.x + B.x) / 2; return [{ x, y: A.y }, { x, y: B.y }]; }
    return [A, B];
  });
  const an = m.an ? m.an(R) : [];
  return { sg, an, dash: [...(gg?.dash || []), ...an.flatMap(q => q.dash || [])] };
}
const geomPts = g => [...g.sg.flat(), ...g.dash.flat(), ...g.an.map(q => q.v)];
function viewBoxFor(pts) {
  const xs = pts.map(q => q.x), ys = pts.map(q => q.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const w = Math.max(x1 - x0, (y1 - y0) * 1.25, 60) * 1.45, h = w * .8;
  return { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - h / 2, w, h };
}
/* видимая область «всё лицо»: габариты всех поставленных точек с полями (после выравнивания) */
function fullVB(pts, rot) {
  const q = Object.values(pts).map(p => rotPt(p, rot));
  const xs = q.map(p => p.x), ys = q.map(p => p.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = Math.max(x1 - x0, y1 - y0) * .12;
  let w = x1 - x0 + 2 * pad; const h = y1 - y0 + 2 * pad; if (h > w * 1.35) w = h / 1.35;
  return { x: (x0 + x1) / 2 - w / 2, y: (y0 + y1) / 2 - h / 2, w, h };
}
const svgBase = (vb, rot, attrs = '', I = { img: cur.img, w: cur.w, h: cur.h }) => `<svg ${attrs} viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}"><image href="${I.img}" width="${I.w}" height="${I.h}" transform="rotate(${deg(rot)})"/>`;

function arcSvg(q, vbw, sw) {
  const ua = sub(q.a, q.v), ub = sub(q.b, q.v), la = Math.hypot(ua.x, ua.y), lb = Math.hypot(ub.x, ub.y);
  if (!la || !lb) return '';
  const r = Math.min(Math.min(la, lb) * .42, vbw * .09);
  const e1 = { x: ua.x / la, y: ua.y / la }, e2 = { x: ub.x / lb, y: ub.y / lb };
  const p1 = { x: q.v.x + e1.x * r, y: q.v.y + e1.y * r }, p2 = { x: q.v.x + e2.x * r, y: q.v.y + e2.y * r };
  const sweep = e1.x * e2.y - e1.y * e2.x > 0 ? 1 : 0;
  let bx = e1.x + e2.x, by = e1.y + e2.y, bl = Math.hypot(bx, by);
  if (bl < 1e-6) { bx = -e1.y; by = e1.x; bl = 1; }
  bx /= bl; by /= bl;
  const fs = vbw / 30, tr = r + fs * .95;
  return `<path d="M${q.v.x} ${q.v.y} L${p1.x} ${p1.y} A${r} ${r} 0 0 ${sweep} ${p2.x} ${p2.y}Z" fill="${Settings.line}" fill-opacity=".35" stroke="${Settings.line}" stroke-width="${sw * .9}" stroke-linejoin="round"/>` +
    `<text x="${q.v.x + bx * tr}" y="${q.v.y + by * tr}" font-size="${fs}" font-weight="700" font-family="Manrope,system-ui,sans-serif" text-anchor="middle" dominant-baseline="central" fill="#fff" stroke="#031519" stroke-opacity=".75" stroke-width="${fs * .22}" paint-order="stroke" stroke-linejoin="round">${angV(ua, ub).toFixed(1)}°</text>`;
}
function geomSvg(g, vbw, ends = true) {
  const sw = vbw / 230, C = Settings.line, k = Settings.width || 1, dk = Settings.dot || 1;
  const ln = (a, b, w, extra) => `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
  let s = '<g fill="none">';
  (g.full || []).forEach(([a, b]) => s += ln(a, b, sw * .9 * k, 'stroke="#ffd45e" stroke-opacity=".85" stroke-dasharray="' + sw * 5 + ' ' + sw * 3.5 + '"'));
  [...g.sg, ...g.dash].forEach(([a, b]) => s += ln(a, b, sw * 3.4 * k, 'stroke="#031519" stroke-opacity=".32"'));
  g.dash.forEach(([a, b]) => s += ln(a, b, sw * .9 * k, `stroke="${C}" stroke-opacity=".9" stroke-dasharray="${sw * 3} ${sw * 2.6}"`));
  g.sg.forEach(([a, b]) => s += ln(a, b, sw * 1.1 * k, `stroke="${C}"`));
  s += '</g>' + g.an.map(q => arcSvg(q, vbw, sw)).join('');
  if (ends) s += g.sg.flat().map(p => `<circle cx="${p.x}" cy="${p.y}" r="${sw * 1.7 * dk}" fill="#fff" stroke="${C}" stroke-width="${sw * .7}"/>`).join('');
  return s;
}
/* схема метрики гармонии (анфас): приближение к зоне замера, как раньше */
function measureSvg(m) {
  const rot = faceFrame(), g = frameGeom(m, rot), pts = geomPts(g), vb = (m.wide || !pts.length) ? fullVB(cur.pts, rot) : viewBoxFor(pts);
  return svgBase(vb, rot) + geomSvg(g, vb.w) + '</svg>';
}
function refreshRes() { const A = analyze(cur.pts, Settings.level, cur.own); RES = A.R; cur.harmony = A.harmony; }
function renderMetricDetail(i) {
  refreshRes();
  det = { kind: 'm', i };
  const m = RES[i], used = [...new Set(segs(m.ln).flat())].map(k => PTS.find(p => p.k === k)).filter(Boolean);
  render('mdetail', `<div class="top"><h1>${m.name}</h1>${scoreHtml(m.score)}</div>
    ${FULL[m.name] ? `<div class="mute">${FULL[m.name]}</div>` : ''}
    <div class="card det" style="display:block">${measureSvg(m)}${metricCurveCard(m)}<p>${m.ds}</p>
      <div class="gl">${used.map(p => `<figure>${dgm(p.k)}${p.ru}</figure>`).join('')}</div>
      <p><b>Значение:</b> ${fmtVal(m.v, m.u)} · <b>Норма:</b> ${m.min}–${m.max}${m.u}</p>
      <p><b>Оценка:</b> ${m.score.toFixed(1)}/10</p>
      <div class="row"><button class="btn sec" data-a="fix" data-i="${i}">Править точки замера</button></div></div>
    <div class="row"><button class="btn sec" data-a="back">‹ Назад</button></div>${detNav()}`, true);
}

/* ---------- правка точек прямо по схеме замера ---------- */
const fixEdit = () => fix.m.solo ? cur.own[fix.m.name] : cur.pts;
function fixSeed() {
  if (!fix.m.solo) return;
  cur.own = cur.own || {};
  const o = cur.own[fix.m.name] = cur.own[fix.m.name] || {};
  fix.keys.forEach(k => { if (!o[k]) o[k] = { ...cur.pts[k] }; });
}
function renderFix(i) {
  const m = RES[i], rot = faceFrame();
  CTX = { pts: cur.pts, rot: 0 };
  const keys = [...new Set(segs(m.ln).flat().flatMap(k => VIRT[k] || [k]))].filter(k => cur.pts[k]);
  fix = { i, m, keys, rot, vb: null, active: null,
          backup: Object.fromEntries(keys.map(k => [k, { ...cur.pts[k] }])),
          prevOwn: m.solo && cur.own?.[m.name] ? JSON.parse(JSON.stringify(cur.own[m.name])) : null };
  fixSeed();
  const g = frameGeom(m, rot), E = fixEdit();
  fix.vb = viewBoxFor([...geomPts(g), ...keys.map(k => rotPt(E[k], rot))]);
  render('fix', `<div class="top"><h1>${m.name}</h1></div><div class="mute">${m.ds}</div>
    <div class="card fxs" id="fxv"></div>
    <div id="fx">${svgBase(fix.vb, rot, 'id="fxsvg" style="touch-action:none"')}<g id="ov"></g></svg>
      <div class="lpw" id="lpw">${svgBase({ x: 0, y: 0, w: 10, h: 10 }, rot, 'id="lpsvg"')}</svg></div></div>
    <p class="mute" style="font-size:12px;text-align:center">Коснитесь нужной точки и ведите палец — рядом появится лупа. Выбирается ближайшая к пальцу точка.${m.solo ? '<br>Точки этой метрики правятся отдельно: остальные метрики не меняются.' : ''}</p>
    <div class="row"><button class="btn sec" data-a="fxreset">Сбросить правки</button><button class="btn" data-a="fxdone">Готово</button></div>`);
  fixDraw(); fixInfo(); bindFix();
}
function fixDraw() {
  const g = frameGeom(fix.m, fix.rot), vbw = fix.vb.w, sw = vbw / 230, E = fixEdit();
  $('#ov').innerHTML = geomSvg(g, vbw, false) + fix.keys.map(k => {
    const q = rotPt(E[k], fix.rot), on = k === fix.active;
    return `<circle cx="${q.x}" cy="${q.y}" r="${sw * (on ? 2.8 : 1.9) * (Settings.dot || 1)}" fill="${on ? '#e8503a' : '#fff'}" stroke="${on ? '#fff' : Settings.line}" stroke-width="${sw * .7}"/>`;
  }).join('');
}
function fixInfo() {
  const m = fix.m;
  CTX = { pts: ptsOf(m), rot: Settings.level ? faceRot(cur.pts) : 0 };
  let v = NaN; try { v = m.f(); } catch {}
  const ok = isFinite(v), dv = ok ? scoreMetric(m, v).score : 0, pt = PTS.find(p => p.k === fix.active);
  $('#fxv').innerHTML = `<b style="font-size:20px">${ok ? fmtVal(v, m.u) : '—'}</b> <span class="mute">норма ${m.min}–${m.max}${m.u} · оценка ${dv.toFixed(1)}/10</span>` +
    (pt ? `<p style="font-size:13px">Точка: ${pt.ru}</p>` : '');
}
function bindFix() {
  const svg = $('#fxsvg'), lpw = $('#lpw'), lps = $('#lpsvg');
  const toFrame = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };
  const loupe = k => {
    const q = rotPt(fixEdit()[k], fix.rot), s = svg.getBoundingClientRect().width / fix.vb.w, lw = 104 / (s * 3), fr = (q.x - fix.vb.x) / fix.vb.w;
    lps.setAttribute('viewBox', `${q.x - lw / 2} ${q.y - lw / 2} ${lw} ${lw}`);
    lpw.style.display = 'block'; lpw.style.left = fr < .45 ? 'auto' : '8px'; lpw.style.right = fr < .45 ? '8px' : 'auto';
  };
  let grab = null;
  svg.onpointerdown = e => {
    const f = toFrame(e), E = fixEdit(); let best = null, bd = Infinity;
    fix.keys.forEach(k => { const q = rotPt(E[k], fix.rot), dd = Math.hypot(q.x - f.x, q.y - f.y); if (dd < bd) { bd = dd; best = k; } });
    if (!best || bd > fix.vb.w * .16) return;
    const q = rotPt(E[best], fix.rot);
    grab = { k: best, dx: q.x - f.x, dy: q.y - f.y }; fix.active = best;
    svg.setPointerCapture(e.pointerId); haptic(); fixDraw(); fixInfo(); loupe(best);
  };
  svg.onpointermove = e => {
    if (!grab) return;
    const f = toFrame(e), X = f.x + grab.dx, Y = f.y + grab.dy, c = Math.cos(fix.rot), s = Math.sin(fix.rot);
    fixEdit()[grab.k] = { x: clamp(X * c + Y * s, 0, cur.w), y: clamp(-X * s + Y * c, 0, cur.h) };
    fixDraw(); fixInfo(); loupe(grab.k);
  };
  const end = () => { if (!grab) return; grab = null; lpw.style.display = 'none'; persist(); };
  svg.onpointerup = end; svg.onpointercancel = end;
}
function fixRestore() {
  if (fix.m.solo) {
    if (fix.prevOwn) cur.own[fix.m.name] = JSON.parse(JSON.stringify(fix.prevOwn));
    else if (cur.own) delete cur.own[fix.m.name];
  } else Object.entries(fix.backup).forEach(([k, q]) => { cur.pts[k] = { ...q }; });
}

reg('platysma', 'MISC', 'Платизма', [{ p: ['leftBottomGonion', 'rightBottomGonion', ['neckRight', 0, .12], ['neckLeft', 0, .12]], sort: true }]);
reg('underEye', 'MISC', 'Зона под глазами', underEye());
reg('darkCircles', 'MISC', 'Тёмные круги', underEye());
reg('eyeBags', 'MISC', 'Мешки под глазами', underEye());
reg('eyeRed', 'MISC', 'Покраснение глаз', sides(eyeP));
reg('scleralShow', 'MISC', 'Склеральный показ', sides(eyeP));
reg('scleraRed', 'MISC', 'Покраснение склер', sides(eyeP));

reg('lashes', 'MISC', 'Ресницы', sides(s => ({ p: [[s + 'EyeMedialCanthus', 0, -.012], [s + 'EyeUpperEyelid', 0, -.025], [s + 'EyeLateralCanthus', 0, -.012], [s + 'EyeLowerEyelid', 0, .02]], corners: [s + 'EyeMedialCanthus', s + 'EyeLateralCanthus'] })));
reg('browColor', 'MISC', 'Цвет бровей', sides(browP));
reg('ptosis', 'MISC', 'Опущение век', sides(s => ({ p: [s + 'EyeMedialCanthus', s + 'UpperEyelidCrease', s + 'EyeLateralCanthus', s + 'EyeUpperEyelid'], corners: [s + 'EyeMedialCanthus', s + 'EyeLateralCanthus'] })));
reg('upperLid', 'MISC', 'Верхнее веко', sides(s => ({ p: [s + 'EyeMedialCanthus', [s + 'UpperEyelidCrease', 0, -.01], s + 'EyeLateralCanthus', s + 'EyeUpperEyelid'], corners: [s + 'EyeMedialCanthus', s + 'EyeLateralCanthus'] })));
reg('bulbous', 'MISC', 'Луковичный кончик носа', [{ p: ['noseLeft', 'noseRight', ['noseBottom', 0, -.075], 'noseBottom'], sort: true }]);
reg('nostrils', 'MISC', 'Ноздри', [{ p: [['noseLeft', -.01, 0], ['noseRight', -.01, 0], ['noseBottom', 0, .005], ['noseBottom', 0, -.03]], sort: true }]);

/* Гладкая кривая через точки (Катмулл–Ром). closed — замкнутая */
function crSeg(Pn, closed) {
  const n = Pn.length, N = 14, out = [], g = i => closed ? Pn[(i + n) % n] : Pn[clamp(i, 0, n - 1)];
  for (let i = 0; i < (closed ? n : n - 1); i++) {
    const a = g(i - 1), b = g(i), c = g(i + 1), e = g(i + 2);
    for (let t = 0; t < N; t++) {
      const u = t / N, u2 = u * u, u3 = u2 * u;
      const f = (p0, p1, p2, p3) => .5 * (2 * p1 + (p2 - p0) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (3 * p1 - p0 - 3 * p2 + p3) * u3);
      out.push({ x: f(a.x, b.x, c.x, e.x), y: f(a.y, b.y, c.y, e.y) });
    }
  }
  if (!closed) out.push(Pn[n - 1]);
  return out;
}
function shapeOf(pts, corners, poly) {
  if (poly || pts.length < 3) return pts;
  if (!corners.length) return crSeg(pts, true);
  const c = [...corners].sort((a, b) => a - b), out = [];
  c.forEach((ci, j) => {
    const nj = c[(j + 1) % c.length], seg = [pts[ci]];
    let i = ci;
    do { i = (i + 1) % pts.length; seg.push(pts[i]); } while (i !== nj);
    out.push(...crSeg(seg, false).slice(0, -1));
  });
  return out;
}
function regionPaths(key) {
  const rot = faceFrame();
  CTX = { pts: cur.pts, rot: 0 };
  const L = k => rotPt(raw(k), rot);
  const H = Math.abs(L('chinBottom').y - L('hairline').y) || 1;
  const cx = ['hairline', 'innerCupidsBow', 'noseBottom', 'chinBottom'].reduce((t, k) => t + L(k).x, 0) / 4;
  const el = e => { const [k, ox = 0, oy = 0] = Array.isArray(e) ? e : [e], p = L(k); return { x: p.x + (p.x < cx ? -1 : 1) * ox * H, y: p.y + oy * H, k }; };
  return REGIONS[key].parts.map(part => {
    let pts, corners = [], lines = [];
    if (part.lips) {
      const [a, b] = [L('mouthLeft'), L('mouthRight')].sort((u, v) => u.x - v.x), c = L('cupidsBow'),
            m = { x: 2 * cx - c.x, y: c.y }, [p1, p2] = [c, m].sort((u, v) => u.x - v.x);
      pts = [a, p1, L('innerCupidsBow'), p2, b, L('lowerLip')]; corners = [0, 4];
      lines = [crSeg([a, L('mouthMiddle'), b], false)];
    } else {
      pts = part.p.map(el);
      if (part.sort) { const c = mean(pts); pts.sort((u, v) => Math.atan2(u.y - c.y, u.x - c.x) - Math.atan2(v.y - c.y, v.x - c.x)); }
      corners = (part.corners || []).map(k => pts.findIndex(q => q.k === k)).filter(i => i >= 0);
    }
    return { poly: shapeOf(pts, corners, part.poly), lines };
  });
}

const imgCache = {};
const getImg = async () => imgCache[cur.id] || (imgCache[cur.id] = await new Promise((ok, fail) => {
  const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = cur.img;
}));
const trace = (g, pts, close) => { g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y)); if (close) g.closePath(); };
async function regionImage(key, px = 640) {
  const im = await getImg(), have = PTS.filter(p => cur.pts[p.k]).length >= 6;     // точки ещё не расставлены → всё фото без выравнивания
  let rot = 0; if (have) { try { rot = faceFrame() || 0; } catch {} }
  let S, ox, oy, k;
  if (have) {
    const q = PTS.filter(p => cur.pts[p.k]).map(p => rotPt(cur.pts[p.k], rot));
    const xs = q.map(a => a.x), ys = q.map(a => a.y), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    S = Math.max(x1 - x0, y1 - y0) * 1.45; ox = (x0 + x1) / 2 - S / 2; oy = (y0 + y1) / 2 - S / 2;
  } else { S = Math.max(cur.w, cur.h); ox = cur.w / 2 - S / 2; oy = cur.h / 2 - S / 2; }
  k = px / S;
  const c = Object.assign(document.createElement('canvas'), { width: px, height: px }), g = c.getContext('2d');
  g.fillStyle = '#566064'; g.fillRect(0, 0, px, px);
  g.save(); g.scale(k, k); g.translate(-ox, -oy); g.rotate(rot); g.drawImage(im, 0, 0, cur.w, cur.h); g.restore();
  return c.toDataURL('image/jpeg', .92);
}

/* ---------- данные оценки ---------- */
const gender = () => cur.gender || 'male';
const allKeys = () => Object.keys(REGIONS).filter(k => !REGIONS[k].only || REGIONS[k].only === gender());
const fmtS = v => v == null ? '—' : v.toFixed(1);
function groupScore(g) {
  const keys = allKeys().filter(k => REGIONS[k].g === g), done = keys.filter(k => cur.ref?.[k] != null);
  return { n: done.length, total: keys.length, score: done.length ? done.reduce((t, k) => t + refScore(cur.ref[k]), 0) / done.length : null };
}

/* Если имя папки с эталонами отличается от названия в приложении — укажите его здесь */
const FOLDER = {
  chinDef: 'Чёткость Подбородка',
  dNose: 'Нос (Анфас)',
  crows: 'Гусинные лапки',
  darkCircles: 'Темные круги'
};
const refPath = (key, i) => encodeURI(`${REF_DIR}/${gender()}/${GROUPS[REGIONS[key].g].dir}/${FOLDER[key] || REGIONS[key].ru}/frame_${String(i).padStart(4, '0')}.webp`);

/* ---------- итоговая формула ----------
   Итог = 0.40·гармония + 0.15·диморфизм + 0.25·ангулярити + 0.20·misc */
const W = { harm: .4, dimo: .15, angu: .25, misc: .20 };
const WNAME = { harm: 'Гармония', dimo: 'Диморфизм', angu: 'Ангулярити', misc: 'Misc' };
function finalScore() {
  const parts = {
    harm: combinedHarmony(),
    dimo: groupScore('DIMO').score,
    angu: groupScore('ANGU').score,
    misc: groupScore('MISC').score
  };
  const ready = Object.values(parts).every(v => v != null);
  const total = ready ? W.harm * parts.harm + W.dimo * parts.dimo + W.angu * parts.angu + W.misc * parts.misc : null;
  return { parts, ready, total };
}

/* ---------- оценка одной метрики ---------- */
let rate = null;
function renderRefRate(key) {
  const keys = allKeys(), i = keys.indexOf(key), r = REGIONS[key], saved = cur.ref?.[key];
  rate = { key, idx: saved ?? Math.round((FRAMES - 1) / 2) };
  const strip = Array.from({ length: FRAMES }, (_, n) => `<figure data-a="rpick" data-i="${n}" id="th${n}"><img loading="lazy" src="${refPath(key, n)}" alt="" onerror="this.remove()"><b>${n}</b></figure>`).join('');
  render('refrate', `<div class="top"><h1>${r.ru}</h1><span class="mute">${i + 1}/${keys.length}</span></div>
    <div class="mute">${GROUPS[r.g].ru} · ${gender() === 'male' ? 'мужчина' : 'женщина'}${cur.refPhase ? ' · последний шаг: оценка по эталонам' : ''}</div>
    <div class="refpair"><figure><img class="cv" id="rc" data-a="zoomsrc" alt=""><figcaption>Ваше фото</figcaption></figure>
      <figure><img class="cv" id="rf" data-a="zoomsrc" alt=""><figcaption id="rcap"></figcaption></figure></div>
    <div id="rcurve"></div>
    <div class="card"><input type="range" id="rs" min="0" max="${FRAMES - 1}" value="${rate.idx}" style="width:100%;accent-color:var(--teal)">
      <div class="strip" id="strip">${strip}</div>
      <p class="mute" style="font-size:12px">Двигайте ползунок или нажмите на кадр: выберите эталон, на который контур похож больше всего. Нажмите на картинку, чтобы увеличить.</p>
      <div class="row"><button class="btn sec" data-a="rsave">Сохранить оценку</button></div>
      <button class="lnk" data-a="rclr">Сбросить оценку</button>
      ${cur.refPhase ? '<button class="lnk" data-a="rskip" style="margin-left:14px">Пропустить к результату</button>' : ''}</div>
    <div class="nav"><button class="btn sec sq" data-a="rprev">‹</button>
      <select id="rsel">${keys.map(k => `<option value="${k}" ${k === key ? 'selected' : ''}>${cur.ref?.[k] != null ? '✓ ' : ''}${REGIONS[k].ru}</option>`).join('')}</select>
      <button class="btn sq" data-a="rnext">›</button></div>`, true);
  refShow(false);
  regionImage(key).then(u => { if (rate?.key === key && $('#rc')) $('#rc').src = u; }).catch(() => toast('Не удалось построить контур'));
}
function refShow(save = true) {
  const { key, idx } = rate;
  if (save) { cur.ref = cur.ref || {}; cur.ref[key] = idx; persist(); }
  const rf = $('#rf'), done = cur.ref?.[key] != null;
  rf.onerror = () => { rf.style.visibility = 'hidden'; $('#rcap').textContent = `Не найден: ${decodeURI(refPath(key, idx))}`; };
  rf.onload = () => { rf.style.visibility = ''; };
  rf.src = refPath(key, idx);
  $('#rcap').textContent = 'Эталон';
  $('#rs').value = idx;
  $('#rcurve').innerHTML = `<p style="margin:12px 0 0"><b>${done ? 'Ваш показатель: ' + refScore(idx).toFixed(1) + '/10' : 'Оценка не выбрана'}</b></p>` + refCurveCard(idx);
  document.querySelectorAll('#strip figure').forEach((f, n) => f.classList.toggle('on', n === idx));
  const s = $('#strip'), f = $('#th' + idx); if (s && f) s.scrollLeft = f.offsetLeft - s.clientWidth / 2 + f.offsetWidth / 2;
  const sel = $('#rsel'), o = sel?.options[sel.selectedIndex]; if (o) o.textContent = `${done ? '✓ ' : ''}${REGIONS[key].ru}`;
}
function rateStep(s) {
  const keys = allKeys(), i = keys.indexOf(rate.key) + s;
  if (i < 0) return;
  if (i >= keys.length) {
    if (cur.refPhase) { cur.refPhase = false; cur.refDone = true; persist(true); return renderResult(null, 'over'); }   // оценка по эталонам закончена → результат
    return renderResult(null, REGIONS[rate.key].g);
  }
  renderRefRate(keys[i]); scrollTo(0, 0);
}

/* =====================================================================
   10. ДЕЙСТВИЯ И НАВИГАЦИЯ
   ===================================================================== */
const openRecord = async id => {
  const r = await Store.get(id); if (!r) return toast('Запись не найдена');
  cur = r; kind = 'front'; hsub = 'front'; cur.own = cur.own || {}; cur.ref = cur.ref || {}; cur.ppts = cur.ppts || {};
  if (isComplete(r) && cur.refDone == null && !cur.refPhase) cur.refDone = true;
  if (!cur.gender && !isComplete(r)) renderGender();
  else if (isComplete(r) && !cur.refPhase) { cur.gender = cur.gender || 'male'; tab = 'over'; renderResult(null, 'over'); }
  else if (isComplete(r)) renderRefRate(allKeys().find(k => cur.ref?.[k] == null) || allKeys()[0]);
  else { const miss = PTS.findIndex(p => !r.pts[p.k]); cur.i = miss >= 0 ? miss : 0; renderMark(); }
  scrollTo(0, 0);
};
const goBack = () => {
  if (view === 'fix') { fixRestore(); persist(true); return renderMetricDetail(fix.i); }
  if (view === 'mdetail' || view === 'pdetail' || view === 'gdetail') { renderResult(null, tab); return scrollTo(0, listY); }
  if (view === 'refrate') { persist(true); return cur.refPhase ? renderHome() : renderGroupDetail(rate.key); }
  if (view === 'settings') return renderHome();
  if (view === 'guide') return ({ settings: renderSettings, mark: () => cur ? renderMark() : renderHome(), result: () => cur ? renderResult() : renderHome() }[guideFrom] || renderHome)();
  persist(true); renderHome();
};
const zoomImg = src => {
  const ov = Object.assign(document.createElement('div'), { className: 'ov', innerHTML: `<img src="${src}" alt="">` });
  ov.dataset.a = 'close'; document.body.appendChild(ov);
};

const ACTIONS = {
  pick: () => $('#file').click(),
  open: ({ id }) => openRecord(id),
  async del({ id }) { if (await ask('Удалить этот анализ из истории?')) { await Store.del(id); renderHome(); } },
  prev: () => step(-1),
  next: () => step(1),
  clear() { const k = K(); delete k.pts[k.list[cur[k.key]].k]; persist(); renderMark(); },
  edit() { kind = tab === 'harm' && hsub === 'side' && cur.pimg ? 'side' : 'front'; cur[K().key] = 0; renderMark(); scrollTo(0, 0); },
  sub({ s }) { hsub = s; renderResult(null, 'harm'); },
  ppick() { $('#pfile').click(); },
  pedit() { kind = 'side'; const miss = PPTS.findIndex(p => !cur.ppts?.[p.k]); cur.pi = miss >= 0 ? miss : 0; renderMark(); scrollTo(0, 0); },
  popen: ({ i }) => { listY = scrollY; renderProfileDetail(+i); scrollTo(0, 0); },
  home: () => { persist(true); renderHome(); scrollTo(0, 0); },
  tab({ t }) { renderResult(null, t); scrollTo(0, 0); },
  mopen: ({ i }) => { listY = scrollY; renderMetricDetail(+i); scrollTo(0, 0); },
  gopen: ({ k }) => { listY = scrollY; renderGroupDetail(k); scrollTo(0, 0); },
  dstep({ d }) {                                                       // листание метрик ‹ › внутри страницы метрики
    const o = detOrder(), p = o.indexOf(det.i) + (+d);
    if (p < 0 || p >= o.length) return;
    openDetail(o[p]);
  },
  fix: ({ i }) => { renderFix(+i); scrollTo(0, 0); },
  fxreset() { fixRestore(); fixSeed(); fix.active = null; persist(); fixDraw(); fixInfo(); },
  fxdone() { persist(true); renderMetricDetail(fix.i); scrollTo(0, 0); },
  guide() { guideFrom = view; renderGuide(); scrollTo(0, 0); },
  back: goBack,
  settings() { renderSettings(); scrollTo(0, 0); },
  setgender({ v }) {                                          // сначала разметка точек анфас/профиль, потом оценка по эталонам
    kind = 'front'; cur.gender = v; cur.refPhase = false;
    persist(true); renderMark(); scrollTo(0, 0);
  },
  rskip() { cur.refPhase = false; cur.refDone = true; persist(true); renderResult(null, 'over'); scrollTo(0, 0); },
  swapgender() { cur.gender = gender() === 'male' ? 'female' : 'male'; persist(true); renderResult(null, tab); },
  rrate({ k }) { renderRefRate(k); scrollTo(0, 0); },
  rpick({ i }) { rate.idx = +i; refShow(true); haptic(); },
  rsave() { refShow(true); haptic(); toast('Оценка сохранена'); },
  rclr() { delete cur.ref[rate.key]; persist(); refShow(false); },
  rprev: () => rateStep(-1),
  rnext: () => rateStep(1),
  zoom({ k }) { zoomImg(`${IMG_DIR}/${k}.webp`); },
  zoomsrc(_, el) { if (el.getAttribute('src') && el.style.visibility !== 'hidden') zoomImg(el.src); },
  close: (_, el) => el.remove()
};

app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (b && ACTIONS[b.dataset.a]) ACTIONS[b.dataset.a](b.dataset, b);
});
document.body.addEventListener('click', e => { const o = e.target.closest('.ov'); if (o) o.remove(); });
app.addEventListener('input', e => { if (e.target.id === 'rs' && rate) { rate.idx = +e.target.value; refShow(true); } });
app.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'sel') { cur[K().key] = +t.value; persist(); renderMark(); scrollTo(0, 0); }
  else if (t.id === 'pfile' && t.files[0]) loadProfileFile(t.files[0]);
  else if (t.id === 'rsel') { renderRefRate(t.value); scrollTo(0, 0); }
  else if (t.id === 'dsel') openDetail(det.kind === 'g' ? t.value : +t.value);
  else if (t.dataset.set) { Settings[t.dataset.set] = t.type === 'color' || t.tagName === 'SELECT' ? t.value : t.type === 'range' ? +t.value : t.checked; saveSettings(); applyBrand(); }
  else if (t.id === 'file' && t.files[0]) {
    try { cur = await createRecord(t.files[0]); await Store.put(cur); tab = 'over'; renderGender(); scrollTo(0, 0); }
    catch (err) { toast(err.message || 'Не удалось загрузить фото'); }
  }
});
try { tg?.BackButton?.onClick(goBack); } catch {}

/* ---------- старт ---------- */
(async () => { try { await migrateOldDraft(); } catch {} try { await renderHome(); } catch (e) { showFatal(e?.stack || e); } })();
</script></body></html>
